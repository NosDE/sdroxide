[package]
name = "sdroxide-radio"
version.workspace = true
edition.workspace = true

[features]
# SoapySDR is optional so a CAT-only build needs no libSoapySDR installed.
default = ["soapy"]
soapy = ["dep:soapysdr"]

[dependencies]
sdroxide-types.workspace = true
sdroxide-dsp.workspace = true
num-complex.workspace = true
thiserror.workspace = true
tracing.workspace = true
soapysdr = { version = "0.5.1", optional = true }
triple_buffer = "9.0.0"
crossbeam-channel.workspace = true
rtrb.workspace = true
sdroxide-config = { path = "../sdroxide-config" }
sdroxide-digi = { path = "../sdroxide-digi" }
sdroxide-skimmer = { path = "../sdroxide-skimmer" }
sdroxide-net = { path = "../sdroxide-net" }
# The built-in TCI server, which the engine owns and feeds. (The TCI *client*
# in the same crate is built by the binary, not from here.)
sdroxide-tci.workspace = true
# The built-in rigctld server: control-only, so unlike TCI it carries no
# streams — the engine just publishes state and drains requests.
sdroxide-rigctld = { path = "../sdroxide-rigctld" }
sdroxide-wsjtx = { path = "../sdroxide-wsjtx" }
# SSTV: encode received images to PNG for the config store, decode composed
# TX images (PNG) back to RGB. Minimal formats to keep the build lean.
image = { version = "0.25", default-features = false, features = ["png"] }
shine-rs = "0.1.3"
